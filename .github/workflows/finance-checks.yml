name: Finance checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser navigation behavior
        run: node --test tests/Frontend/navigation.test.mjs
      - name: Check salary batch entry behavior
        run: node --test tests/Frontend/payroll-batch.test.cjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, dom, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Run isolated database tests
        run: vendor/bin/phpunit --do-not-cache-result
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
